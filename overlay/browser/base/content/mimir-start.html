<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src chrome:; script-src chrome:; img-src chrome:; object-src 'none'"
    />
    <title>Mimir</title>
    <link rel="stylesheet" href="chrome://browser/content/mimir-start.css" />
  </head>
  <body>
    <main>
      <header>
        <img
          id="logo"
          src="chrome://branding/content/about-logo@2x.png"
          width="56"
          height="56"
          alt=""
        />
        <div>
          <h1 id="greeting">Mimir</h1>
          <p id="date"></p>
        </div>
        <time id="clock"></time>
      </header>

      <section id="music" class="card" aria-labelledby="music-title">
        <h2 id="music-title" data-i18n="music-title"></h2>
        <p id="music-hint" class="muted"></p>
        <div id="services" role="radiogroup" aria-labelledby="music-title"></div>
        <a id="music-open" class="primary" hidden></a>
        <div id="moods" hidden></div>
      </section>

      <section class="card" aria-labelledby="shortcuts-title">
        <h2 id="shortcuts-title" data-i18n="shortcuts-title"></h2>
        <ul id="shortcuts"></ul>
        <form id="shortcut-form" hidden>
          <input
            id="shortcut-url"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" data-i18n="add"></button>
        </form>
      </section>

      <footer>
        <p id="stats"></p>
        <p class="muted" data-i18n="promise"></p>
      </footer>
    </main>
    <script src="chrome://browser/content/mimir-start.js"></script>
  </body>
</html>
